<main class="ad-listing" id="main-content">
	<header class="ad-shell ad-listing__hero ad-listing__hero--images" data-reveal>
		<span class="ad-listing__face" aria-hidden="true">🎨</span>
		<p class="ad-eyebrow">Image galleries</p>
		<h1>{{title}}</h1>
		<p>Colorful image collections organized by series, visual style, and the ideas that sparked them.</p>
	</header>
	<section class="ad-shell" aria-label="Antonio's image galleries">
		<ul class="ad-card-grid ad-card-grid--images">{{cards}}</ul>
		{{pagination}}
	</section>
</main>
