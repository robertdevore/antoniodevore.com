<main class="ad-listing" id="main-content">
	<header class="ad-shell ad-listing__hero" data-reveal>
		<span class="ad-listing__face" aria-hidden="true">🎮</span>
		<p class="ad-eyebrow">Game shelf</p>
		<h1>{{title}}</h1>
		<p>Playable browser games, experiments, release notes, and the stories behind how Antonio builds them.</p>
	</header>
	<section class="ad-shell" aria-label="Antonio's games">
		<ul class="ad-card-grid">{{cards}}</ul>
		{{pagination}}
	</section>
</main>
